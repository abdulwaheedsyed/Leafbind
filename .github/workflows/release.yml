name: Release

# Push a tag such as v1.2.3 to build, test and publish a release.
on:
  push:
    tags: ["v*"]

# Read-only by default; only the publish job writes.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: make package VERSION=${{ github.ref_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archives
          path: |
            dist/*.tar.gz
            dist/*.zip

  # Apple silicon refuses to run unsigned code, and an app bundle whose
  # signature does not cover its Info.plist and resources is reported as
  # damaged. The Go linker signs the arm64 executable, but not the bundle
  # around it, so each bundle is signed here, ad hoc, on a Mac.
  sign-macos:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archives
          path: dist
      - name: Sign the app bundles
        env:
          COPYFILE_DISABLE: "1" # no AppleDouble files in the archives
        run: |
          set -e
          for a in dist/*-darwin-*.tar.gz; do
            name=$(basename "$a" .tar.gz)
            rm -rf work && mkdir work
            tar -xzf "$a" -C work
            codesign --force --sign - "work/$name/Leafbind.app"
            codesign --verify --strict --verbose=2 "work/$name/Leafbind.app"
            tar -C work --uid 0 --gid 0 -czf "$a" "$name"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: archives-signed
          path: dist/*-darwin-*.tar.gz

  publish:
    needs: sign-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create the release
      id-token: write     # sign the attestations
      attestations: write # store them
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archives
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: archives-signed
          path: dist
      - run: cd dist && sha256sum *.tar.gz *.zip > SHA256SUMS && cat SHA256SUMS
      # A signed record that each archive was built by this workflow, from
      # this commit; verify one with
      #   gh attestation verify <archive> --repo abdulwaheedsyed/leafbind
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
