name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "Not gofmt-formatted:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - name: Source files carry the license header
        run: |
          missing=$(git ls-files '*.go' '*.js' '*.css' '*.html' | grep -v '^internal/check/schema/' |
            xargs grep -L 'SPDX-License-Identifier: Apache-2.0' || true)
          if [ -n "$missing" ]; then echo "Missing the license header:"; echo "$missing"; exit 1; fi
      - name: go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  # Every commit of a pull request must be signed off by its author,
  # certifying the Developer Certificate of Origin; see CONTRIBUTING.md.
  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          bad=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            # Bots such as Dependabot cannot sign off; their changes are
            # reviewed by whoever merges them.
            case "$author" in *"[bot]"*) continue ;; esac
            if ! git log -1 --format='%B' "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") is not signed off by $author"
              bad=1
            fi
          done
          if [ "$bad" = 1 ]; then
            echo "Sign off each commit with git commit -s; see CONTRIBUTING.md."
            exit 1
          fi

  # The full suite, including end-to-end conversions through the embedded
  # PDF engine, on each operating system and architecture that is released.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64 }
          - { os: macos-latest, platform: darwin/arm64 }
          - { os: windows-latest, platform: windows/amd64 }
          - { os: windows-11-arm, platform: windows/arm64 }
    name: test (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # On Windows, link the icon and version resources into the test
      # binary, so TestWindowsResources can check Windows reads them.
      - name: Windows resources
        if: runner.os == 'Windows'
        run: go run ./tools/packaging winres
      - name: go test
        run: go test ./...
        env:
          CGO_ENABLED: "0"
      # Intel macOS: the Apple silicon runner runs amd64 binaries under
      # Rosetta, which exercises the darwin/amd64 build without an Intel host.
      - name: go test (darwin/amd64 under Rosetta)
        if: runner.os == 'macOS'
        run: go test ./...
        env:
          CGO_ENABLED: "0"
          GOARCH: amd64

  # The built-in validation is tested against results recorded from
  # epubcheck. This checks the recording against a live epubcheck, so it
  # cannot drift from what epubcheck really reports.
  epubcheck:
    name: recorded results match epubcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Install epubcheck 5.4.0
        run: |
          curl -sSfL -o "$RUNNER_TEMP/epubcheck.zip" https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          unzip -q "$RUNNER_TEMP/epubcheck.zip" -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/bin/sh\nexec java -jar "%s/epubcheck-5.4.0/epubcheck.jar" "$@"\n' "$RUNNER_TEMP" > "$RUNNER_TEMP/bin/epubcheck"
          chmod +x "$RUNNER_TEMP/bin/epubcheck"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - run: epubcheck --version
      # Each of the corpus's books is a Java start-up; past go test's
      # default ten minutes, the run would be cut short.
      - run: go test -run TestEpubcheckGolden -v -timeout 30m ./internal/check
        env:
          EPUBCHECK_VERIFY: "1"

  # The native window: the interface must load in the system web view, not
  # fall back to a browser. LEAFBIND_SMOKE_TEST makes the program quit, and
  # say where, once the page has connected.
  native-window:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, arch: amd64 }
          - { os: windows-11-arm, arch: arm64 }
          - { os: macos-latest, arch: arm64 }
          - { os: macos-latest, arch: amd64 } # under Rosetta
    name: native window (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOARCH: ${{ matrix.arch }}
        run: |
          ext=
          if [ "$RUNNER_OS" = Windows ]; then go run ./tools/packaging winres; ext=.exe; fi
          go build -o "smoke/leafbind$ext" .
      - name: The interface loads in the native window
        shell: bash
        env:
          LEAFBIND_SMOKE_TEST: "1"
        run: |
          bin=./smoke/leafbind
          if [ "$RUNNER_OS" = Windows ]; then bin=./smoke/leafbind.exe; fi
          out=$(perl -e 'alarm 120; exec @ARGV' "$bin" 2>&1) || true
          echo "$out"
          echo "$out" | grep -q "connected, in the native window"

  # The application bundle: signed the way releases are, then checked by
  # the tools macOS itself uses.
  macos-app:
    name: macOS app bundle
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make app
        env:
          CGO_ENABLED: "0"
      - run: plutil -lint dist/Leafbind.app/Contents/Info.plist
      - run: codesign --force --sign - dist/Leafbind.app
      - run: codesign --verify --strict --verbose=2 dist/Leafbind.app
      - run: dist/Leafbind.app/Contents/MacOS/leafbind --version
      - name: The icon is readable
        run: sips -g pixelWidth dist/Leafbind.app/Contents/Resources/Leafbind.icns

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make package
      # The Linux binaries must stay static, to run on musl systems and in
      # minimal containers; a dependency that needs the dynamic loader would
      # quietly change that.
      - name: Linux binaries are statically linked
        run: |
          for f in dist/leafbind-*-linux-amd64 dist/leafbind-*-linux-arm64; do
            file "$f"
            file "$f" | grep -q "statically linked"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leafbind-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
          retention-days: 14
